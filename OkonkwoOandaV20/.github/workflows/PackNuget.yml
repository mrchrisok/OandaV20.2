name: 00_Publish_Nuget_Pkg

on:
  workflow_dispatch:
  push:
    branches: [develop, master]
    
jobs:
  version_01:
    name: Set Project Version
    runs-on: ubuntu-latest
    steps:
      - name: Set version
        id: set_version
        run: |
          majorNumber=2
          minorNumber=$(date +"%Y")
          patchNumber=$(date +"%-m%d")
          revisionNumber=${{github.run_number}}
          echo "Version is $majorNumber.$minorNumber.$patchNumber.$revisionNumber"
          echo "version=$majorNumber.$minorNumber.$patchNumber.$revisionNumber" >> $GITHUB_OUTPUT
    outputs:
      version: ${{steps.set_version.outputs.version}}
      
  build_02: 
    name: Build & Publish Nuget Package
    runs-on: ubuntu-latest
    needs: version_01
    timeout-minutes: 15
    
    env:
      PROJECT_NAME: OkonkwoOandaV20
      PROJECT_FOLDER: ./OkonkwoOandaV20
      PROJECT_FILE: ./OkonkwoOandaV20/OkonkwoOandaV20/OkonkwoOandaV20.csproj
      VERSION: ${{needs.version_01.outputs.version}}

    permissions:
      id-token: write  # declare nuget key scope
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: | 
          8.0.x
          9.0.x

    - name: Build
      working-directory: ${{env.PROJECT_FOLDER}}
      run: |
        dotnet build -c Release -p:Version=${{env.VERSION}}

    - name: Pack
      working-directory: ${{env.PROJECT_FOLDER}}
      run: |
        dotnet pack -c Release -p:PackageVersion=${{env.VERSION}} --no-build --output .

    - name: NuGet Login 
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER_NAME }}

    - name: Publish Nuget package
      if: github.event_name == 'workflow_dispatch' && github.ref_name == 'master'
      working-directory: ${{env.PROJECT_FOLDER}}
      run: |
        packageName="${{env.PROJECT_NAME}}.${{env.VERSION}}.nupkg"
        sourceUrl="https://api.nuget.org/v3/index.json"
        nugetApiKey=${{steps.nuget-login.outputs.NUGET_API_KEY}}
        dotnet nuget push $packageName -s $sourceUrl -k $nugetApiKey --skip-duplicate
